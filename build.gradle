// Gemeinsame Konfiguration für alle Module (core, plugin).
plugins {
    id 'com.gradleup.shadow' version '9.0.0' apply false
}

subprojects {

    apply plugin: 'com.gradleup.shadow'
    apply plugin: 'java'

    group = 'at.woodexplosive'

    repositories {
        mavenCentral()
        maven {
            name = "papermc-repo"
            url = "https://repo.papermc.io/repository/maven-public/"
        }
        maven {
            name = "codemc-repo"
            url = "https://repo.codemc.io/repository/maven-public/"
        }
    }

    dependencies {
        implementation 'com.jeff-media:custom-block-data:2.2.4'
        implementation('com.github.retrooper:packetevents-spigot:2.13.0') {
            exclude group: 'io.netty'
        }
        compileOnly 'io.netty:netty-all:4.1.72.Final'
    }

    shadowJar {
        relocate 'com.jeff_media.customblockdata', "at.woodexplosive.lib.customblockdata"
        relocate 'com.github.retrooper.packetevents', 'at.woodexplosive.lib.packetevents.api'
        relocate 'io.github.retrooper.packetevents', 'at.woodexplosive.lib.packetevents.impl'
    }

    def targetJavaVersion = 21
    java {
        def javaVersion = JavaVersion.toVersion(targetJavaVersion)
        sourceCompatibility = javaVersion
        targetCompatibility = javaVersion
        if (JavaVersion.current() < javaVersion) {
            toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
            options.release.set(targetJavaVersion)
        }
    }
}
