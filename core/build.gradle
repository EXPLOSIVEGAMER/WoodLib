// woodlib-core: die reine Library. KEINE plugin.yml.
// Consumer nutzen dieses Artefakt: compileOnly (Standalone) oder implementation + Shade.
plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    compileOnly 'io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT'
}

// Javadoc- und Sources-JAR miterzeugen und -veröffentlichen (für Consumer-IDEs).
java {
    withJavadocJar()
    withSourcesJar()
}

tasks.named('javadoc') {
    options.encoding = 'UTF-8'
    // doclint aus: bricht sonst an undokumentierten Elementen / externen @links ab.
    options.addStringOption('Xdoclint:none', '-quiet')
}

// Gradle Module Metadata (.module) NICHT veröffentlichen.
// JitPack schreibt darin die Classifier-URLs falsch (sources/javadoc zeigen aufs
// Haupt-JAR) -> Prüfsummen-Mismatch -> Consumer-IDE bekommt keine Sources/Javadoc.
// Ohne .module löst Gradle über die .pom + Classifier-Konvention auf und findet
// -sources.jar / -javadoc.jar korrekt.
tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = false
}

// packetevents/custom-block-data werden relociert (siehe root build.gradle shadowJar-Relocations)
// direkt in die published Jar mitgeshaded -> Consumer brauchen weder codemc-repo
// noch eigenes Shading dieser Libs mehr, POM bleibt frei von diesen Runtime-Dependencies.
// archiveBaseName (statt archiveClassifier) geändert, damit die Datei nicht mit core-<version>.jar
// der normalen jar-Task kollidiert (sonst von :plugin:shadowJar als undeklarierte Task-Abhängigkeit
// erkannt), aber trotzdem klassifikatorlos published wird - sonst hat die Publication kein
// Standard-Artefakt und Maven/Gradle-Consumer lösen sie nicht automatisch auf (packaging=pom-Bug).
shadowJar {
    archiveBaseName.set('woodlib-core')
    archiveClassifier.set('')
}

publishing {
    publications {
        shadow(MavenPublication) {
            from components.shadow
            groupId = 'at.woodexplosive'
            artifactId = 'woodlib-core'
            artifact tasks.sourcesJar
            artifact tasks.javadocJar
        }
    }
}
